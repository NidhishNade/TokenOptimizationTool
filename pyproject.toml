[project]
name = "token-optimizer"
version = "1.4.0"
description = "Measure and reduce tokens in LLM prompts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ui = [
    "streamlit>=1.30",
]
llm = [
    "gpt4all>=2.8",
]

# This makes `token-optimizer` runnable as a terminal command after install.
[project.scripts]
token-optimizer = "optimizer.cli:main"

[tool.pytest.ini_options]
# Let tests import the package from the src/ folder.
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
